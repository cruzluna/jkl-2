name: Dev Preview Binaries

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  BIN_NAME: jkl

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: jkl-x86_64-apple-darwin.tar.gz
            use_zigbuild: false
          - os: macos-14
            target: aarch64-apple-darwin
            asset: jkl-aarch64-apple-darwin.tar.gz
            use_zigbuild: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: jkl-x86_64-unknown-linux-gnu.tar.gz
            use_zigbuild: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset: jkl-aarch64-unknown-linux-gnu.tar.gz
            use_zigbuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig
        if: matrix.use_zigbuild == true
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild == true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binary
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/${{ matrix.asset }}" \
            "${{ env.BIN_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish Dev Preview Assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release metadata
        id: meta
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          short_sha=$(printf '%s' "$GITHUB_SHA" | cut -c1-7)
          tag="v${version}-dev.${GITHUB_RUN_NUMBER}.${short_sha}"
          title="Dev Preview ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "title=${title}" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create dev preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          prerelease: true
          make_latest: false
          files: |
            dist/jkl-x86_64-apple-darwin.tar.gz
            dist/jkl-aarch64-apple-darwin.tar.gz
            dist/jkl-x86_64-unknown-linux-gnu.tar.gz
            dist/jkl-aarch64-unknown-linux-gnu.tar.gz
