name: Release Binaries

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

env:
  BIN_NAME: jkl

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            asset: jkl-x86_64-apple-darwin.tar.gz
            use_zigbuild: false
          - os: macos-14
            target: aarch64-apple-darwin
            asset: jkl-aarch64-apple-darwin.tar.gz
            use_zigbuild: false
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: jkl-x86_64-unknown-linux-gnu.tar.gz
            use_zigbuild: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            asset: jkl-aarch64-unknown-linux-gnu.tar.gz
            use_zigbuild: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install zig and cargo-zigbuild
        if: matrix.use_zigbuild == true
        uses: taiki-e/install-action@v2
        with:
          tool: zig,cargo-zigbuild

      - name: Build binary
        run: |
          if [ "${{ matrix.use_zigbuild }}" = "true" ]; then
            cargo zigbuild --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Package tarball
        run: |
          mkdir -p dist
          tar -C "target/${{ matrix.target }}/release" \
            -czf "dist/${{ matrix.asset }}" \
            "${{ env.BIN_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          files: |
            dist/jkl-x86_64-apple-darwin.tar.gz
            dist/jkl-aarch64-apple-darwin.tar.gz
            dist/jkl-x86_64-unknown-linux-gnu.tar.gz
            dist/jkl-aarch64-unknown-linux-gnu.tar.gz
